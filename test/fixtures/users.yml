# Passwordless: email auth is magic-link only. No password_digest is set —
# the column is dormant (DB default ""), kept only so the schema is unchanged.
# Fixture label `alex` (referenced by entries.yml / contests.yml as `user: alex`)
# is the HUMAN operator. Per the 2026-06-02 naming flip the human is now
# "Mr. McRitchie" / username `mcritchie`; the bot took over the bare `alex`
# name/username (the bot is not represented as a fixture). The fixture LABEL
# stays `alex` to avoid churning the entry/contest fixture references — it is a
# Rails fixture identifier, not the username or slug.
alex:
  name: Mr. McRitchie
  username: mcritchie_test
  email: alex@mcritchie.studio
  role: admin
  session_token: <%= SecureRandom.hex(32) %>

jordan:
  name: Jordan
  username: jordan_test
  email: jordan@mcritchie.studio
  session_token: <%= SecureRandom.hex(32) %>

sam:
  name: Sam
  username: sam_test
  email: sam@mcritchie.studio
  web3_solana_address: foUuRyeibadQoGdKXZ9pBGDqmkb1jY1jYsu8dZ29nds
  session_token: <%= SecureRandom.hex(32) %>

# A COMBO account: a managed web2 wallet AND a linked Phantom, on two DIFFERENT
# addresses. It existed nowhere in this suite, which is how a whole class of
# wallet-selection bug stayed invisible — `User#solana_address` prefers web3
# unconditionally, and with only web3-only fixtures every "which wallet?" test
# was true by construction. Tokens::LevelUpGrant reads balances off ONE of these
# two and must never write a zero from the wrong one.
casey:
  name: Casey
  username: casey_test
  email: casey@mcritchie.studio
  web2_solana_address: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
  web3_solana_address: 7bQmGnT4kFvVJfZ8dLpR2sYcXwNhE5aKtM3uD6gWqPzR
  session_token: <%= SecureRandom.hex(32) %>
