name: CI

on:
  pull_request:
  push:
    # `release` too — the sweep's merge commit (what QA deploys and ship
    # fast-forwards to main) must earn its own CI verdict, not just the local
    # G3 gate. Guarded by test/lib/ci_workflow_triggers_test.rb.
    #
    # `accepted` IS THE SAME ARGUMENT ONE RUNG EARLIER, and it was the hole here
    # until 2026-08-18. Review merges several approved PRs onto `accepted`,
    # producing a combination that is individually green and has never been
    # executed together; nothing built it, so nothing could fail.
    #
    # THIS WAS NOT MERELY A MISSING VERDICT — IT SILENTLY DISARMED A GUARD.
    # `bin/release prepare` refuses to promote a RED `accepted`
    # (refuse_red_accepted!), and it read this repo's verdict as :none — which by
    # design does NOT block, because refusing on an absent verdict would wedge the
    # release lane on every race. So the guard passed over turf-monster in every
    # release without ever having been CAPABLE of failing, while its success line
    # named this repo as checked. Certified fleet-wide by
    # Release::AcceptedCertification in mcritchie-studio, which refuses a promote
    # naming any repo whose suite workflow cannot build this branch.
    branches: [ main, release, accepted ]

# NO `concurrency:` BLOCK — deliberately, and mcritchie-studio's ci.yml carries the
# full argument. In short: a cancelled run's conclusion is `cancelled`, CiStatus folds
# that as RED, and every reader here is SHA-addressed — so a run superseded by the next
# merge is indistinguishable from a genuine failure, and the sweep's own `accepted`
# guard would refuse to promote a perfectly healthy branch. Back-to-back pushes to
# `accepted` are NORMAL. Cheaper CI is not worth a gate that cries wolf.

jobs:
  # THE STATIC LANE — brakeman, importmap audit and rubocop in ONE job.
  #
  # These were three jobs doing identical setup (checkout, await-gem-propagation, ruby) and
  # then running one command each. Merged, the setup is paid once instead of three times.
  # Ported from mcritchie-studio, where it was measured: 37s, 22s and 52s of actual work
  # behind ~20s of setup APIECE.
  #
  # WHAT IT BUYS IS SLOTS, NOT SECONDS. The merged lane is LONGER than the slowest of the
  # three was alone, and that is fine — it is nowhere near the critical path, which is the
  # `playwright` shard. What it frees is two concurrency slots on a repo that runs eight
  # jobs (scan×2, lint, test, playwright×3, e2e_executed_set) against a ~20-job account
  # ceiling that two PRs in flight already approach.
  #
  # `if: always()` ON THE SECOND AND THIRD CHECKS is load-bearing. As separate jobs all
  # three ran regardless of each other's verdict. In one job a failing step stops the rest
  # by default — so a brakeman finding would hide every rubocop offence in the same run, and
  # you would fix, push, and wait a full lane to meet the next one. With always() all three
  # run and the job still reports RED if any failed, so a single run tells you everything
  # that is wrong. It is not an opt-out: always() can only FORCE a step, never exclude one,
  # which is why test/lib/ci_workflow_triggers_test.rb permits it and refuses every
  # event-context condition.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: 3.5.11
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for security vulnerabilities in JavaScript dependencies
        if: always()
        run: bin/importmap audit

      - name: Lint code for consistent style
        if: always()
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # NONE of these three is REQUIRED by the unit suite any more — see
    # app/services/solana/keypair.rb. Under Rails.env.test? ONLY, Solana::Keypair
    # falls back to fixed non-secret values for the admin signer and for
    # secret_key_base, so the suite runs with no credentials at all. That is
    # load-bearing: DEPENDABOT pull requests execute against the separate
    # Dependabot secret store and cannot read repository secrets by design, so
    # every dependency PR on this repo used to fail these same tests forever —
    # no rebase or re-run could clear it. Proven by
    # test/services/solana/keypair_admin_fallback_test.rb, which also asserts
    # the fallbacks stay unreachable in every non-test environment.
    #
    # They are still supplied here so that ORDINARY (non-Dependabot) PRs
    # exercise the real key material and the real credentials derivation rather
    # than the fallback:
    # MANAGED_WALLET_ENCRYPTION_KEY: throwaway value so the v2 managed-wallet
    #   encryptor has a non-empty key (KeyGenerator). NOT the OPSEC-015 prod key.
    # RAILS_MASTER_KEY: repo secret so credentials.secret_key_base decrypts, so
    #   the LEGACY keypair encryptor is exercised against a real secret_key_base.
    # SOLANA_ADMIN_KEY: a THROWAWAY base58 keypair (NOT the prod Alex Bot
    #   signer). No test asserts the pubkey, so any valid keypair works;
    #   secret-stored so the value never lands in the repo.
    env:
      MANAGED_WALLET_ENCRYPTION_KEY: ci-test-only-managed-wallet-key-not-a-real-secret
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SOLANA_ADMIN_KEY: ${{ secrets.SOLANA_ADMIN_KEY }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
      # NO google-chrome-stable. This job used to install a full browser and then run
      # `test:system` against a `test/system` directory holding exactly one file: `.keep`.
      # It certified nothing and charged every turf PR for the privilege. The emptiness is
      # a CHECKED fact, not an assumption — see the guard in
      # test/lib/ci_workflow_triggers_test.rb below, and the hub's own
      # test/models/release/repos_test.rb, which asserts the same thing from the release
      # registry's side ("turf-monster grew system tests — its gate must now cover them").
      #
      # WHEN A SYSTEM TEST LANDS, PUT THE LANE BACK. Both guards go red the moment
      # test/system stops being empty, which is the whole reason removing this is safe
      # rather than merely cheaper.
        #
        # The fetch is BOUNDED and RETRIED — see .github/scripts/apt-retry for the
        # incident, the measured budgets, and why the loop lives in a script rather
        # than inline here. Ported from mcritchie-studio, where the Ubuntu mirror
        # stalled SIX times across five PRs on 2026-08-19, each one burning the full
        # 45-minute job bound on a branch with nothing wrong in it.
        #
        # CHECKOUT MOVED ABOVE THIS STEP, and that is part of the change rather than
        # tidying. This step used to run FIRST, before the repo existed, which an
        # inline `run:` block can do and a script invocation cannot. The hub shipped
        # exactly that ordering bug and killed four jobs in ~30 seconds on "No such
        # file or directory"; test/lib/ci_apt_step_timeout_test.rb now pins the order
        # so it cannot come back. Nothing here needs the packages, so hoisting the
        # checkout is safe: it only needs git, which the runner image already has.
        #
        # This bound is the backstop, not the mechanism: the script's escalating
        # budgets total ~22 minutes, and 25 sits above that and well below the
        # 45-minute job bound, so a step that blows through its retries still fails
        # long before it can take the whole job down with it.
        timeout-minutes: 25
        run: .github/scripts/apt-retry curl libjemalloc2 libvips postgresql-client

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: 3.5.11
          bundler-cache: true

      # THE SUITE READS THE COMPILED STYLESHEET, so it must exist before the suite runs.
      # test/views/layer_scale_adoption_test.rb asserts that every --z-* layer tier a
      # browser resolves comes from studio-engine and is defined exactly once — the only
      # check that can speak to CASCADE ORDER, which is what the deleted layer-scale
      # shim actually broke. No source scan can answer that question.
      #
      # THIS IS NOT REDUNDANT WITH THE LINE BELOW, and that is measured rather than
      # assumed: tailwindcss-rails enhances Rails' `test:prepare` hook, and
      # `bin/rails db:test:prepare test` does NOT fire it — only an ARGLESS `rails test`
      # COMMAND invokes test:prepare, and a leading non-command routes this whole line
      # through RAKE instead. Verified by deleting app/assets/builds/tailwind.css,
      # running `bin/rails db:test:prepare`, and finding it still absent. The playwright
      # job below already pays for the same build, for the same reason.
      - name: Build Tailwind CSS for the suite
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails tailwindcss:build

      # `db:test:prepare test` — the SYSTEM tier is gone with the browser above. Keep
      # db:test:prepare FIRST: `test` is a real rails COMMAND, so a rails-command first arg
      # would parse the rest of the line as paths; a leading non-command routes the whole
      # thing through RAKE, where each token is a task. Routing through rake is ALSO why
      # this line does NOT fire Rails' own `test:prepare` hook (the one tailwindcss-rails
      # enhances): rake's `test` task carries no prerequisites, and `db:test:prepare` is
      # not the task that gets enhanced. That is what the explicit build step above covers.
      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shard the single-worker E2E suite across N isolated jobs. In-process
    # Playwright workers are UNSAFE here: POST /test/reseed (TestController) is
    # a stop-the-world reset of the shared DB + Redis (wipes users id>5, resets
    # GeoSetting, clears rack-attack counters), so concurrent specs would
    # clobber each other. Every chromium spec runs `beforeEach(reseed)`, which
    # buys SERIAL independence, not parallel. So we parallelize at the only safe
    # boundary — a whole stack: each shard is a separate runner with its own
    # postgres+redis service + test server, no state shared across shards, and
    # the serial reseed-per-spec model preserved within each shard. ~Nx faster.
    # The `--shard` denominator is derived from `strategy.job-total`, so the
    # shard count lives in one place — this matrix list.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # See the test job. Managed-wallet flows (signup) need the encryption
    # key; RAILS_MASTER_KEY lets credentials decrypt for the test server.
    # SOLANA_ADMIN_KEY (throwaway, see test job) — the test server boots the
    # app, and admin-signed Solana paths call Solana::Keypair.admin. The server
    # boots in RAILS_ENV=test, so it too would reach the test-env fallback if
    # this were absent; it is supplied so ordinary PRs run against real key
    # material.
    # SOLANA_RPC_URL: black-hole loopback so the e2e stack is HERMETIC.
    #   Without it the test server defaults to public devnet
    #   (https://api.devnet.solana.com) and every authenticated HTML request
    #   blocks on live RPC (perform_solana_preload before_action; the test
    #   env's :null_store disables the 60s caches, so every request re-fires).
    #   At peak hours devnet throttles (429 + stalls), requests degrade to
    #   3-6s+, and the tightest post-click assertion window dies first —
    #   model_page.spec.js toHaveURL(5s) stuck on /admin/dashboard while
    #   GET /models/contest/random starves (trace: run 29254091915).
    #   Nothing listens on port 9, so connect fails instantly
    #   (Errno::ECONNREFUSED is not in the RPC client's retry set) and the
    #   app takes its designed nil-safe fallbacks.
    #
    #   COVERAGE, STATED HONESTLY: server-side on-chain paths are NOT
    #   exercised by any e2e that currently runs. This job excludes the
    #   @devnet specs (--grep-invert), and devnet-nightly.yml — the workflow
    #   that would run them — is DISABLED: it gates on
    #   `vars.DEVNET_NIGHTLY_ENABLED == 'true'`, and every scheduled run has
    #   completed `skipped`. It has never run. Do not read this pin as
    #   "covered elsewhere" — it is covered nowhere today.
    #
    #   WHAT LICENSES THE PIN: no e2e asserts the observables these RPCs
    #   feed. That is a MEASUREMENT, not an argument — the full chromium
    #   suite is 79/79 green under this black hole. It is NOT the case that
    #   "nothing changes" (see below); it is that nothing we assert changes.
    #
    #   Be precise about what the preload fires. The e2e user is an ADMIN
    #   (e2e/global-setup.js swaps the canonical admin's wallet to
    #   MOCK_PUBKEY_B58), and an admin render fires TWO server-side on-chain
    #   RPCs, both re-firing every request under :null_store:
    #
    #     1. list_entry_tokens (:617) → getProgramAccounts(dataSize:124,
    #        memcmp@8=wallet) (vault.rb:1771-1786). Against devnet for the
    #        e2e wallet this returns [] — and NOT vacuously: the program
    #        holds 72 entry-token accounts today, none owned by that wallet.
    #        So the count is 0 live and rescues to 0 here. CONTINGENT: mint
    #        an entry token to that wallet and this stops being true.
    #
    #     2. vault_state (:626-639) → read_vault_state → get_account_info on
    #        the vault PDA (seeds [b"vault"] = J7b5g9uS…HkK2). That PDA EXISTS
    #        on devnet (1515 bytes, program-owned), so live returns a real
    #        struct, while under this pin it rescues to Current.vault_state =
    #        nil + vault_state_error = true (:643-652). This observable REALLY
    #        DOES CHANGE. No running spec asserts it — that, and only that, is
    #        why the pin is safe.
    #
    #   Do NOT restate this as "the e2e wallet has no devnet state" — it has:
    #   6ASf…pGWt holds ~86 SOL in a real program-owned account. The reads
    #   above stay harmless only because the preload no longer fires
    #   get_balance / the USDC+seeds reads (:605-614).
    #
    #   Browser-side RPC is separately mocked (e2e/rpc-mock.js).
    #
    #   A black hole simulates an ABSENT RPC, not a FLAKY one — ECONNREFUSED
    #   is never wrapped into Solana::Client::RpcError, so the app's
    #   RpcError-only fail-open rescues do NOT fire here. Nothing in this job
    #   proves the production RPC-flake fallbacks work.
    #
    #   TEST-ENV ONLY. Copying this URL into a non-test env KILLS BOOT:
    #   config/initializers/solana_network_alignment.rb rescues only
    #   Solana::Client::RpcError (:48), so ECONNREFUSED escapes. In CI we are
    #   saved by its `skip` (:21) — which is `Rails.env.test?` OR
    #   `SOLANA_SKIP_NETWORK_CHECK=true`; only the former applies here.
    #
    #   Pinned by test/lib/ci_playwright_hermetic_test.rb.
    env:
      MANAGED_WALLET_ENCRYPTION_KEY: ci-test-only-managed-wallet-key-not-a-real-secret
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SOLANA_ADMIN_KEY: ${{ secrets.SOLANA_ADMIN_KEY }}
      SOLANA_RPC_URL: http://127.0.0.1:9
      # AWS creds: DUMMY throwaway values (test storage is `:test` = Disk, so
      # these never reach real S3). The active_storage_public_services
      # initializer instantiates the `amazon_public` S3 clients at boot; with NO
      # creds the AWS SDK falls through to an EC2 instance-metadata lookup that
      # hangs on the runner (no metadata endpoint) — ×2 clients ×3 app boots in
      # the webServer command, intermittently pushing boot past its 30s timeout
      # (the shard-1 `Aws::InstanceProfileCredentials::TokenRetrivalError` flake).
      # Supplying creds skips the metadata lookup, so boot is fast and stable.
      AWS_ACCESS_KEY_ID: ci-e2e-dummy-not-a-real-secret
      AWS_SECRET_ACCESS_KEY: ci-e2e-dummy-not-a-real-secret
      AWS_REGION: us-east-1
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: .ruby-version, rubygems: 3.5.11, bundler-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # CACHE THE BROWSER, keyed on the resolved Playwright version. Measured on run
      # 32329065176, this step cost ~21s per shard — three shards, every run, re-downloading
      # a Chromium that has not changed. The key comes from package-lock.json so a Playwright
      # bump invalidates it automatically; there is nothing to remember to bump by hand.
      #
      # `--with-deps` still runs on a cache HIT, and that is deliberate: the cache holds the
      # browser, not the apt libraries headless Chromium needs to launch, and a restored
      # browser that cannot start reads as a mysterious lane failure rather than a missing
      # package. It is a few seconds; the download is the part worth saving.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright + browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Seed test DB
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bin/rails runner -e test e2e/seed.rb
      # The test server (bin/rails server -e test, started by Playwright's
      # webServer) serves the compiled Tailwind stylesheet. Without this
      # build, app/assets/builds/tailwind.css is absent and every page 500s
      # ("asset tailwind.css is not present in the asset pipeline"), which
      # cascaded into 51/57 spec failures.
      - name: Build Tailwind CSS for the test server
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails tailwindcss:build
      - name: Run Playwright (excluding @devnet)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          # THE RECEIPT this shard will be judged on. `list` keeps the human-readable log;
          # `json` emits the machine-readable record of what ACTUALLY EXECUTED, which is
          # the only thing that can tell three green shards over the whole lane from three
          # green shards over nothing.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-report-shard-${{ matrix.shard }}.json
        # `strategy.job-total` is the matrix size, so the shard denominator
        # tracks the matrix automatically. Playwright shards by test; safe
        # because every spec is reseed-independent (no beforeAll state in the
        # chromium project — that lives only in the @devnet specs, which are
        # excluded here and run by devnet-nightly.yml).
        run: npm test -- --grep-invert "@devnet" --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,json

      # ALWAYS, not `if: failure()`. A FAILING spec still RAN — the executed-set gate must
      # see its receipt to count it. Uploading only on failure would mean the gate could
      # audit only the runs that were already red.
      - name: Upload this shard's executed-set receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/e2e-report-shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

      # test-results/ holds the per-test traces + screenshots (use.trace /
      # use.screenshot). This is what lets us diagnose CI-only failures that
      # don't reproduce locally.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # The DECLARED side of the e2e contract, kept honest against the tree.
  #
  # `total_specs` is derivable, and was maintained by hand. Two branches that each
  # add a spec write the SAME new value for DIFFERENT files; identical text merges
  # with NO conflict, so the counter lands silently under-declared. That is not a
  # hypothetical — it happened FOUR TIMES in one day, and once the number was
  # CORRECT when the reviewer derived it and stale by the time the merge ran.
  #
  # Separate from e2e_executed_set on purpose. That job asserts what the lane
  # EXECUTED, needs every shard's receipt, and so must wait for playwright. This
  # one only reads the tree, needs no browser and no database, and runs in
  # parallel in about a minute — so a stale counter is reported early instead of
  # after the full e2e lane.
  e2e_declared_set:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: 3.5.11
          bundler-cache: false

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # No `playwright install` — `--list` collects specs and never launches a
      # browser, so the browser download (and its cache) is pure cost here.
      - name: Install the Playwright package
        run: npm ci

      - name: Assert the declared spec counter matches the tree
        run: bin/e2e-lane-derive

  # THE EXECUTED-SET GATE. The `playwright` job above can prove its specs PASSED; it cannot
  # prove it RAN THEM ALL — no test lane can answer that about itself, and sharding sharpens
  # the question rather than softening it: three buckets can each go quietly empty, and
  # sharding SUPPRESSES Playwright's own "No tests found" guard, so an empty shard exits 0.
  #
  # This is ported from mcritchie-studio, which closed the identical hole after three rounds
  # of review each found a new spelling of "a spec left the executed set" — `.only`,
  # `.skip`/`.fixme`, `testInfo.skip()` on an unwatched receiver, and a widened
  # `--grep-invert` that no guard pinned. Source-reading catches the spellings someone
  # thought to refuse; the receipt catches all of them as one line of arithmetic.
  #
  # `if: always()` is LOAD-BEARING and is the ONLY condition this job may ever carry.
  # Without it a red `playwright` shard SKIPS this job — and a skipped required check does
  # not report failure, so the one gate that would say "the lane ran fewer specs than it
  # claims" goes quiet in precisely the runs where it matters.
  #
  # No bundler cache: the gate is stdlib-only (json + yaml). It audits the suite, so it must
  # not be breakable by a dependency problem in the thing it audits.
  e2e_executed_set:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: playwright
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: 3.5.11
          bundler-cache: false

      - name: Download every shard's receipt
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-shard-*
          path: e2e-reports
          merge-multiple: true

      - name: Assert the lane executed exactly the specs it claims to
        run: bin/e2e-executed-set-check e2e-reports
