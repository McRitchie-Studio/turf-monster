name: Tailwind hook probe (TEMPORARY — delete before merge)

# Measures, on ubuntu, whether Rails' `test:prepare` hook (the one
# tailwindcss-rails enhances with `tailwindcss:build`) fires for each SHAPE of
# the CI suite line. Deleted in the same PR once the receipts are recorded.

on:
  push:
    branches: [ feat/ci-comment-misstates-tailwind-hook ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MANAGED_WALLET_ENCRYPTION_KEY: ci-test-only-managed-wallet-key-not-a-real-secret
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SOLANA_ADMIN_KEY: ${{ secrets.SOLANA_ADMIN_KEY }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        timeout-minutes: 25
        run: .github/scripts/apt-retry curl imagemagick libjemalloc2 libvips postgresql-client

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: 3.5.11
          bundler-cache: true

      - name: 'CELL A — bare: bin/rails db:test:prepare'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          set -x
          rm -f app/assets/builds/tailwind.css
          bin/rails db:test:prepare
          set +x
          echo "=================================================="
          echo "CELL A command: bin/rails db:test:prepare"
          if [ -f app/assets/builds/tailwind.css ]; then
            echo "CELL A RESULT: tailwind.css PRESENT"
          else
            echo "CELL A RESULT: tailwind.css ABSENT"
          fi
          echo "=================================================="

      - name: 'CELL C — path-filtered: TEST=... bin/rails db:test:prepare test'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          TEST: test/lib/ci_job_timeout_test.rb
        run: |
          set -x
          rm -f app/assets/builds/tailwind.css
          bin/rails db:test:prepare test
          set +x
          echo "=================================================="
          echo "CELL C command: TEST=test/lib/ci_job_timeout_test.rb bin/rails db:test:prepare test"
          if [ -f app/assets/builds/tailwind.css ]; then
            echo "CELL C RESULT: tailwind.css PRESENT"
          else
            echo "CELL C RESULT: tailwind.css ABSENT"
          fi
          echo "=================================================="

      - name: 'CELL B — the CI line shape: bin/rails db:test:prepare test'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          rm -f app/assets/builds/tailwind.css
          START=$(date +%s)
          setsid bin/rails db:test:prepare test > /tmp/cellB.log 2>&1 &
          PID=$!
          RESULT=ABSENT
          ELAPSED=-1
          for _ in $(seq 1 600); do
            if [ -f app/assets/builds/tailwind.css ]; then
              RESULT=PRESENT
              ELAPSED=$(( $(date +%s) - START ))
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              ELAPSED=$(( $(date +%s) - START ))
              break
            fi
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then STILL=YES; else STILL=NO; fi
          echo "=================================================="
          echo "CELL B command: bin/rails db:test:prepare test"
          echo "CELL B RESULT: tailwind.css $RESULT at ${ELAPSED}s"
          echo "CELL B suite process still running when observed: $STILL"
          echo "=================================================="
          echo "--- first 60 lines of the suite log at that moment ---"
          head -60 /tmp/cellB.log || true
          kill -TERM -"$PID" 2>/dev/null || kill -TERM "$PID" 2>/dev/null || true
          sleep 2
          pkill -f 'rails test' 2>/dev/null || true
          exit 0
