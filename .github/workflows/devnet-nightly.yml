# Nightly devnet integration — runs Playwright tests tagged @devnet against
# the deployed turf_vault devnet program.
#
# THE SWITCH: the job runs only when the repository VARIABLE
# DEVNET_NIGHTLY_ENABLED is 'true' (Settings → Secrets and variables → Actions →
# Variables). Otherwise it completes `skipped`; a secret's presence does not
# decide it.
#
# THE SECRETS it reads (Settings → Secrets and variables → Actions → Secrets),
# each a base58 64-byte Solana secret key:
#   SOLANA_BOT_KEY   the e2e bot wallet (F6f8h5yy…), funded on devnet
#   MACK_DEVNET_KEY  Mack's devnet wallet (8UwJhRiN…), from 1Password
#                    solana.mack.agent (vault studio-agents, field private-key)
# With either one unset, e2e/devnet-smoke.spec.js skips itself. Keys live only in
# secrets: turf-monster is public, and test/lib/committed_secret_key_guard_test.rb
# fails CI on any Solana secret key committed to the tree.

name: Devnet Nightly

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch:       # also manual trigger

# The run's token reads the repo and the ghcr.io/mcritchie-studio service images,
# and nothing else (test/lib/ci_service_images_test.rb).
permissions:
  contents: read
  packages: read

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Opt-in by repository variable (see the header), so forks and a fresh repo
    # never spend the devnet wallets.
    if: ${{ vars.DEVNET_NIGHTLY_ENABLED == 'true' }}

    services:
      postgres:
        image: ghcr.io/mcritchie-studio/postgres:17
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: ghcr.io/mcritchie-studio/redis:8
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: .ruby-version, rubygems: 3.5.11, bundler-cache: true }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install Playwright + browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed test DB
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bin/rails runner -e test e2e/seed.rb

      - name: Run @devnet Playwright suite
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          SOLANA_BOT_KEY: ${{ secrets.SOLANA_BOT_KEY }}
          MACK_DEVNET_KEY: ${{ secrets.MACK_DEVNET_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: npm test -- --grep "@devnet"

      - name: Notify on failure
        if: failure() && env.RECONCILER_ALERT_WEBHOOK != ''
        env:
          RECONCILER_ALERT_WEBHOOK: ${{ secrets.RECONCILER_ALERT_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":x: Nightly @devnet failed on $(date -u +%Y-%m-%d). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$RECONCILER_ALERT_WEBHOOK"
