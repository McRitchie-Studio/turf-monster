# The VaultState signer-rotation ceremony, per cluster, as data.
#
# Rendered by /admin/authorities/ceremony (Solana::SignerCeremony). Each step
# is either a CONSOLE step (Mr. McRitchie signs it on /admin/authorities; the
# page computes its go/no-go from live reads and links the console with the
# intent pre-filled) or a RUNBOOK step (Steffon's lane: Heroku config,
# 1Password, scripts; the page shows only its verdict, read live).
#
# A console step is DONE when the chain set equals its `end`; a runbook step
# when its `done_when` holds. Sets compare as sets: slot order is the
# program's business, not the checklist's.
#
# Source: the signer-console redesign audit (.agents/epics/audits/), section
# 3, and the rotation target Mr. McRitchie set (NEW, 7ZDJ, 9gAC, 3Qj4, and a
# governance key in slot 5).
#
# SLOT 5 IS A FRESH GOVERNANCE KEY, NOT 4bKN: 4bKN was exposed, so it is in no
# VaultState target. The fresh key is 3LTLPG1s… (solana.turf.governance.v2),
# filed in config/signer_roster.yml; it replaced the `3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9`
# placeholder below. Mainnet has run this checklist to the end: the chain reads
# 3LTL, 7ZDJ, 4S39, 9gAC, 3Qj4, the EVICT's end set.
#
# Keys are full addresses; config/signer_roster.yml names them.

mainnet-beta:
  - id: add
    kind: console
    title: ADD the new server key and slot 5
    who: Mr. McRitchie, one Phantom prompt
    start: [8K81w4e6UcB7TiANhM9N8sAgijJvTxxybRi8AENRaRYd, 7ZDJp7FUHhuceAqcW9CHe81hCiaMTjgWAXfprBM59Tcr, CytJS23p1zCM2wvUUngiDePtbMB484ebD7bK4nDqWjrR]
    end: [8K81w4e6UcB7TiANhM9N8sAgijJvTxxybRi8AENRaRYd, 7ZDJp7FUHhuceAqcW9CHe81hCiaMTjgWAXfprBM59Tcr, CytJS23p1zCM2wvUUngiDePtbMB484ebD7bK4nDqWjrR, 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY, 3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9]
    server: 8K81w4e6UcB7TiANhM9N8sAgijJvTxxybRi8AENRaRYd
    window_cosigners: [CytJS23p1zCM2wvUUngiDePtbMB484ebD7bK4nDqWjrR]
    intent: add
    add: [4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY, 3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9]
    note: Steffon sets Mason's key as a window cosigner (SOLANA_COSIGNER_KEYS) for the sitting first.

  - id: flip
    kind: runbook
    title: Flip production to the new server key
    who: Steffon
    runbook: turf-vault docs/SIGNER_ROTATION.md (the flip); SOLANA_ADMIN_KEY and the window cosigner (the fresh governance key) through the Platform API pipe
    note: Before the flip, the console must show no outstanding rotation wire. The old key's console nonce can only be advanced by the old key, so a wire left on it would stay landable.
    done_when:
      server: 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY

  - id: evict
    kind: console
    title: EVICT 8K81 and Mason, seat Alex's second and third accounts
    who: Mr. McRitchie, one Phantom prompt
    start: [8K81w4e6UcB7TiANhM9N8sAgijJvTxxybRi8AENRaRYd, 7ZDJp7FUHhuceAqcW9CHe81hCiaMTjgWAXfprBM59Tcr, CytJS23p1zCM2wvUUngiDePtbMB484ebD7bK4nDqWjrR, 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY, 3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9]
    end: [7ZDJp7FUHhuceAqcW9CHe81hCiaMTjgWAXfprBM59Tcr, 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY, 3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9, 9gACbzsCLmkYF9Yx1EBGmwMvvyfuTquJ6qs8QsoQvHXf, 3Qj4v9qjhXgkru6zCRCErRVhy8Q6qU3NrNpvpXLTZboA]
    server: 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY
    window_cosigners: [3LTLPG1s952sdNatZWtnfM7r9F3ivWSnPSqfhQLBepJ9]
    intent: remove
    remove: [8K81w4e6UcB7TiANhM9N8sAgijJvTxxybRi8AENRaRYd, CytJS23p1zCM2wvUUngiDePtbMB484ebD7bK4nDqWjrR]
    add: [9gACbzsCLmkYF9Yx1EBGmwMvvyfuTquJ6qs8QsoQvHXf, 3Qj4v9qjhXgkru6zCRCErRVhy8Q6qU3NrNpvpXLTZboA]
    note: The server key is 4S39 now, so the console needs 4S39's own nonce for an untimed sitting. If the console says signing has about 45 seconds, press Prepare console nonce once first (the server pays about 0.0015 SOL). 8K81's nonce stays on chain with its rent until a withdraw.

  - id: unset
    kind: runbook
    title: Unset the window cosigners
    who: Steffon
    runbook: unset SOLANA_COSIGNER_KEYS on turf-monster-mainnet; update config/mainnet_vault_signers.yml
    done_when:
      no_window_cosigners: true

devnet:
  - id: devnet-clear-alex
    kind: runbook
    title: Take Alex's 9gAC and 3Qj4 off devnet once mainnet seats them
    who: Steffon
    runbook: turf-vault scripts/rotate-devnet-signers.js, signed by the three devnet agent keys (no tap)
    done_when:
      not_seated: [9gACbzsCLmkYF9Yx1EBGmwMvvyfuTquJ6qs8QsoQvHXf, 3Qj4v9qjhXgkru6zCRCErRVhy8Q6qU3NrNpvpXLTZboA]
