# The named keys the signer console can pick from. PUBLIC halves only.
#
# Read by Solana::SignerRoster (app/services/solana/signer_roster.rb), which
# refuses this file outright if any value is shaped like a secret: a base58
# string that decodes to 64 bytes, or anything longer than an address. A
# secret here would ship to every browser that opens /admin/authorities.
#
# One entry per key. Fields:
#
#   address   the base58 public key (32 bytes)
#   name      what the page calls it
#   holder    alex | agent. Only `alex` keys are ever asked for in Phantom.
#             `agent` keys sign on the server or not at all.
#   signs_in  phantom | server | script. How this key produces a signature.
#   clusters  where it may be a VaultState signer: mainnet-beta, devnet.
#   op_item   the 1Password item title (a NAME, never a reference to a field)
#   role      one line: what the key is for
#
# A seated key that is not here renders as "unknown key" on the console. That
# is the honest answer, and it is the prompt to add the key here (one PR,
# public half only) rather than to guess.
#
# Sources: turf-vault docs/CURRENT_DEPLOYMENT.md and SIGNER_ROTATION.md, the
# 2026-10-11 signer-console audit (.agents/epics/audits/), and
# config/mainnet_vault_signers.yml. Read off chain 2026-10-12.

