# ROUND TEN, 178 -> 181 (consolidate-wallet-sign-in): three specs in the new
# e2e/wallet_sign_in.spec.js for the one-approval sign-in path, which adopts the
# Wallet Standard `solana:signIn` feature so connect + signMessage collapse into
# a single wallet prompt.
#
# WHY A BROWSER TIER IS OWED, and it is the sharpest case in this file: BOTH
# BRANCHES POST THE IDENTICAL FIVE PARAMS TO THE IDENTICAL ENDPOINT. The server
# cannot tell a signIn from a connect+signMessage — same `message`, `signature`,
# `pubkey`, same `/auth/solana/verify`. So no request test, no integration tier,
# and no amount of response-byte reading can answer "which path ran", which is
# the only question this change is about. Only a browser can witness it.
#   · the provider CONTRACT — supportsSignIn() advertises, and signIn() returns
#     an address, the exact bytes signed, and a 64-byte signature. These are
#     browser-side functions on a provider that exists only in a page; there is
#     no Ruby seam that can call them at all.
#   · the CONSOLIDATED path establishing a real session, asserted through
#     /account/session_state rather than the POST's 200 — a 200 is what the old
#     path returns too.
#   · the FALLBACK, driven by switching supportsSignIn() off at the provider
#     exactly as a wallet that never implemented the feature would present. This
#     one exists because the fallback is the branch that protects every wallet
#     without signIn, and a green suite that only ever ran the new path would
#     say nothing about it.
#
# NOTE ON THE TEST PROVIDER. The KeypairProvider in app/javascript/wallet_provider.js
# now implements signIn deliberately. Without it every test provider would take
# the fallback branch and the new code would NEVER EXECUTE IN CI — a feature
# shipped with zero browser coverage while all three shards reported green, which
# is the precise failure this whole ledger exists to make impossible.
# (An earlier draft of this note credited e2e/keypair-provider.js. Wrong file:
# that one is the devnet-nightly SOLANA_BOT_KEY harness and this change does not
# touch it. Corrected in review — a ledger whose prose points at the wrong file
# is the same class of stale-derivation problem the warnings above describe.)
#
# ROUND TEN, PART TWO, 181 -> 183 (same task, after a review bounce). Two more
# specs in e2e/wallet_sign_in.spec.js pinning the try -> catch -> fallback
# transition, which round ten's three specs did NOT reach: the fallback spec
# there sets supportsSignIn = () => false up front and so never enters the try
# block at all. The bug that exposed the hole: the catch was a catch-ALL, so a
# user DECLINING the one-tap prompt (Phantom rejects with code 4001) was read as
# "this wallet cannot signIn" and dropped into connect() + signMessage() — three
# prompts for a decline, in the change whose purpose is one. It also silently
# broke working decline handling in both callers, which render "Signature
# rejected" off that rejection and can only do so if it propagates.
#   · a rejected signIn PROPAGATES and connect() is never called (written first,
#     confirmed failing against the broken build — rejected:false, connectCalls:1)
#   · a signIn resolving a nonce-less message still FALLS BACK and signs in,
#     which is the side the fix must not break by re-throwing everything
# Both are e2e for the reason the round-ten note gives: the two branches post
# identical params to an identical endpoint, so which one ran is invisible to
# every server-side tier.
#
