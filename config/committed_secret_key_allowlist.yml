# Solana secret keys that may be committed to this PUBLIC repository.
#
# Read by test/lib/committed_secret_key_guard_test.rb (scanner:
# lib/turf_monster/committed_secret_scan.rb), which fails CI on any tracked file
# holding a Solana secret key — base58, or a 64-integer byte array — that is not
# listed here.
#
# An entry is a THROWAWAY fixture key: generated for a test, holding nothing,
# seated nowhere, on any cluster. Name it by its PUBLIC key, never the secret,
# and say why publishing it is harmless. A real wallet never goes here: move its
# secret to an environment variable and rotate it (a committed key is a
# published key; git history keeps it).
#
# An entry the scan no longer finds fails the guard too, so delete the entry in
# the same commit that deletes the fixture.
#
#   allowed:
#     - pubkey: <base58 public key>
#       reason: <why this key is safe to publish>
allowed: []
