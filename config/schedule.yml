# Scheduled jobs run via sidekiq-cron. Loaded by config/initializers/sidekiq_cron.rb.
# Cron syntax: minute hour day month weekday (Sidekiq-cron uses Fugit/standard cron).
#
# To add a job:
#   1. Add an entry below — INCLUDING `active_job: true` (see below)
#   2. Restart Sidekiq (or hit the Sidekiq web UI's Cron page → load schedule)
#   3. Verify it ENQUEUED, not that it registered: /admin/jobs → Cron Jobs shows a
#      non-empty "Last enqueued". A registered cron is not a running cron.
#
# `active_job: true` IS MANDATORY on every entry whose class is an ApplicationJob, and
# it is not the belt-and-braces it looks like. sidekiq-cron also tries to INFER
# ActiveJob from the class, and on Sidekiq 7 that inference can never succeed: the gem
# resolves a bare `ActiveJob::Base` from inside `module Sidekiq::Cron::Job`, where Ruby
# finds Sidekiq's own `Sidekiq::ActiveJob` first — which has no `Base`. The flag is the
# only term that survives. Omit it and the tick calls `perform_async` on an
# ActiveJob::ConfiguredJob, which raises at ENQUEUE, where nothing reaches retry or
# dead and every dashboard still reads healthy.
#
# Measured: all four entries carried the flag from 2026-08-22 (3aa003e) until a merge
# resolution dropped them on 2026-08-25 (4926d38), and no scheduled job ran in either
# environment for the entire window. Guarded now by
# test/initializers/sidekiq_cron_schedule_test.rb, which ENQUEUES rather than reading
# this file — the deleted prose guard is how the flags went missing unnoticed.

# solana_reconcile cron removed 2026-05-19 (OPSEC-040). The scheduled job
# was generating noise (every signed-up-but-never-deposited user appears as
# :missing_onchain_account under lazy ATA per OPSEC-044). Ad-hoc reconciliation
# is still available via `bin/rails solana:reconcile` and
# `bin/rails solana:reconcile_contest CONTEST=<slug>` — Solana::Reconciler
# service kept for that purpose.

nfl_live_poll:
  cron: "*/5 * * * *"    # every 5 minutes, all week, unconditionally
  class: Nfl::LivePollJob
  active_job: true
  description: >-
    ONE ESPN polling cycle, so production contests re-score without a human.
    Until 2026-09-30 nothing in this file named the poller and bin/nfl-live-poll
    was its only non-test caller, so contests re-scored only when an agent
    happened to run live-score-watch — and regular-season week 2 silently
    vanished when nobody did for six days: 16 games Final at ESPN, 16 held at
    status=scheduled with zero goals, a contest with 7 paid entries scoring on
    two weeks out of three. NO GAME WINDOW ON PURPOSE. A window would be derived
    from the very data this job maintains, so a missing slate or stale kickoffs
    would close the gate permanently and silently — the same defect in a
    cleverer costume. One scoreboard request per tick covers the whole slot; a
    per-game summary is spent only when a score moved (under one per cycle
    across a full Sunday). The cycle is idempotent (plays keyed on ESPN's play
    id under a unique index) and SKIPS any game whose every contest has
    settled — per game, so one graded tier cannot stop the open tier beside
    it from scoring.
  queue: default

nfl_silent_gap_check:
  cron: "37 */6 * * *"   # every 6 hours at :37 (offset from the sweepers below)
  class: Nfl::SilentGapCheckJob
  active_job: true
  description: >-
    THE TRIPWIRE FOR A POLLER THAT STOPPED. Detects a slot whose games are FINAL
    at ESPN but carry ZERO scoring events here — the shape of the week-2
    incident, which raised no error, no anomaly and no degraded_feed, and would
    have been found by a customer. A scheduled job fails silently too: on
    2026-08-25 a merge dropped active_job: true from every entry in this file
    and nothing ran for a day with all dashboards green, which is why this does
    not trust nfl_live_poll's health to check it. Costs ZERO network requests on
    a healthy week (the candidate set is one indexed query over our own
    goal-less games). Pages through ErrorLog with the exact repair command in
    the message; deliberately not deduplicated, so an unrepaired gap nags four
    times a day.
  queue: default

outbound_request_sweeper:
  cron: "17 4 * * *"     # daily at 04:17 UTC (off-peak)
  class: OutboundRequestSweeperJob
  active_job: true
  description: Trim outbound_requests audit table. Successful rows kept 90 days, failed rows 180 days.
  queue: default

entry_payment_sweep:
  cron: "*/2 * * * *"    # every 2 minutes
  class: Entries::PaymentSweepJob
  active_job: true
  description: >-
    Settle every entry left with its payment `submitted` from the chain
    (Entries::PaymentSettlement): a ticket that exists confirms the entry; an
    attempt past its wire's last valid block height returns the cart to draft
    with its picks; an unreadable chain leaves the row for the next run. Reads
    only, so a retried run can send nothing. Two cheap reads per stale row and
    none when there is none.
  queue: default

referral_visit_prune:
  cron: "29 4 * * *"     # daily at 04:29 UTC (off-peak, after the two sweepers above)
  class: ReferralVisitPruneJob
  active_job: true
  description: Delete referral_visits rows older than ReferralVisit::RETENTION (400 days).
  queue: default

pending_deposit_reconciler:
  cron: "*/15 * * * *"   # every 15 minutes
  class: PendingDepositReconcilerJob
  active_job: true
  description: >-
    Reconcile stranded pending TransactionLog DEPOSIT rows (die-after-claim in
    StripeDepositJob). READ-ONLY on-chain confirm of the recorded signature:
    landed -> completed; failed/not-found/no-signature -> needs_review + alert.
    NEVER re-transfers. 10-minute threshold leaves in-flight deposits untouched.
  queue: default

level_up_token_mint:
  cron: "*/15 * * * *"   # every 15 minutes
  class: LevelUpTokenMintJob
  active_job: true
  description: >-
    Recovery sweep for free-entry tokens that fresh seed snapshots normally
    enqueue immediately. Candidate query is pure SQL against the denormalized
    mirror, so a sweep with no fresh level-ups costs ZERO Solana RPCs. Deterministic
    source_ref (levelup:<deployment>:<wallet-hash>:<level>) makes the on-chain init constraint the
    double-grant guard, so retries and overlapping runs are safe. Clamped to the
    admin page's own `owed` figure so it never pays over a manual /admin/free_entries mint.
    Batch rotates least-recently-swept first, so a permanently stuck row cannot
    starve the queue, and a user the sweep cannot evaluate raises an ErrorLog
    rather than being skipped silently.
  queue: default

pending_contest_reconciler:
  cron: "*/15 * * * *"   # every 15 minutes
  class: PendingContestReconcilerJob
  active_job: true
  description: >-
    Reconcile stranded pending Contest rows (a crash between finalize's
    write-ahead save and its promote). READ-ONLY on-chain existence check of the
    derived Contest PDA: present -> open; absent -> delete the squatting row;
    RPC fault -> left pending for the next sweep. A row whose PDA does not match
    its slug, or one carrying a broadcast signature, is flagged for a human
    instead. NEVER signs or broadcasts. 10-minute threshold leaves an in-flight
    finalize untouched.
  queue: default
email_delivery_resend:
  cron: "*/20 * * * *"   # every 20 minutes
  class: EmailDeliveryResendJob
  active_job: true
  description: >-
    Re-enqueue EmailDelivery rows left unsent between 30 minutes and 7 days ago,
    at most 100 per tick, oldest first. Covers the gap Sidekiq cannot: a row
    left sent=false with no job anywhere, which is how a winner was paid $100 on
    2026-09-07 and never told. Bounded in three dimensions on purpose — younger
    rows are still in flight, older ones need a human, and a backlog drains
    across ticks. No-ops entirely where LOCAL_EMAIL_CAPTURE is on, since nothing
    there can ever reach sent and the sweep would loop forever.
  queue: default
error_log_cleanup:
  cron: "11 4 * * *"     # daily at 04:11 UTC (off-peak, before the sweepers above)
  class: ErrorLogCleanupJob
  active_job: true
  description: >-
    Delete error_logs rows older than 30 days, the retention ErrorLogCleanupJob
    (studio-engine) defaults to. Runs with no arguments so the job's own default
    stays the single source of the retention.
  queue: default

contest_settlement_sweep:
  cron: "1-59/2 * * * *"   # every 2 minutes, on the odd minute (entry_payment_sweep takes the even)
  class: Contests::SettlementSweepJob
  active_job: true
  description: >-
    Settle every settle_contest transaction left `submitted` from the chain
    (Contests::SettlementReconciler): a confirmed signature marks its contest
    settled and tells the winners; one that failed on chain or can no longer
    land returns to the cosign queue with the reason on the contest, which
    stays settlement_pending; an unreadable chain leaves the row for the next
    run. Reads only, so a retried run can send nothing. No row moves by age
    alone. One indexed query and no RPC when nothing is submitted.
  queue: default
