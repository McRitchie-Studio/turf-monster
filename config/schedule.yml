# Scheduled jobs run via sidekiq-cron. Loaded by config/initializers/sidekiq_cron.rb.
# Cron syntax: minute hour day month weekday (Sidekiq-cron uses Fugit/standard cron).
#
# To add a job:
#   1. Add an entry below
#   2. Restart Sidekiq (or hit the Sidekiq web UI's Cron page → load schedule)
#   3. Verify it appears in /admin/jobs → Cron Jobs

# solana_reconcile cron removed 2026-05-19 (OPSEC-040). The scheduled job
# was generating noise (every signed-up-but-never-deposited user appears as
# :missing_onchain_account under lazy ATA per OPSEC-044). Ad-hoc reconciliation
# is still available via `bin/rails solana:reconcile` and
# `bin/rails solana:reconcile_contest CONTEST=<slug>` — Solana::Reconciler
# service kept for that purpose.

outbound_request_sweeper:
  cron: "17 4 * * *"     # daily at 04:17 UTC (off-peak)
  class: OutboundRequestSweeperJob
  active_job: true
  description: Trim outbound_requests audit table. Successful rows kept 90 days, failed rows 180 days.
  queue: default

pending_transaction_sweeper:
  cron: "23 4 * * *"     # daily at 04:23 UTC (off-peak, offset from outbound_request_sweeper)
  class: PendingTransactionSweeperJob
  active_job: true
  description: Flip stale entry-flow PendingTransactions (pending/submitted older than 1h) to failed so admin reports surface real backlogs only.
  queue: default

pending_deposit_reconciler:
  cron: "*/15 * * * *"   # every 15 minutes
  class: PendingDepositReconcilerJob
  active_job: true
  description: >-
    Reconcile stranded pending TransactionLog DEPOSIT rows (die-after-claim in
    StripeDepositJob). READ-ONLY on-chain confirm of the recorded signature:
    landed -> completed; failed/not-found/no-signature -> needs_review + alert.
    NEVER re-transfers. 10-minute threshold leaves in-flight deposits untouched.
  queue: default

level_up_token_mint:
  cron: "*/15 * * * *"   # every 15 minutes
  class: LevelUpTokenMintJob
  active_job: true
  description: >-
    Recovery sweep for free-entry tokens that fresh seed snapshots normally
    enqueue immediately. Candidate query is pure SQL against the denormalized
    mirror, so a sweep with no fresh level-ups costs ZERO Solana RPCs. Deterministic
    source_ref (levelup:<user_id>:<level>) makes the on-chain init constraint the
    double-grant guard, so retries and overlapping runs are safe. Clamped to the
    admin page's own `owed` figure so it never pays over a manual /admin/free_entries mint.
    Batch rotates least-recently-swept first, so a permanently stuck row cannot
    starve the queue, and a user the sweep cannot evaluate raises an ErrorLog
    rather than being skipped silently.
  queue: default
