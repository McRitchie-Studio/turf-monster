# Which PUBLIC key each environment's system wallet must be.
#
# The system wallet is the key an app loads from SOLANA_ADMIN_KEY: the server's
# own vault signer, fee payer and contest creator. This file names the PUBLIC
# half only. It never holds, and must never hold, a secret.
#
# Read by lib/solana/signer_isolation.rb, which asks two questions of a loaded
# key: is it THIS environment's system wallet, and is it ANOTHER environment's?
# bin/deploy asks them of turf-monster-mainnet and turf-monster-qa before every
# production deploy; config/initializers/solana_signer_isolation.rb asks them of
# the running app at boot and logs the answer.
#
# ── mode ─────────────────────────────────────────────────────────────────────
#
#   warn     (default) report a finding loudly and carry on. Nothing is blocked.
#   enforce  bin/deploy refuses the production deploy on any finding.
#
# If THIS FILE cannot be read (missing, not YAML, not the shape below),
# bin/deploy refuses in either mode: it cannot tell whether enforce was
# committed here, so it fails closed.
#
# SIGNER_ISOLATION=enforce, in the target app's config or the deploying shell,
# also turns enforcement on. Either source can ESCALATE to enforce; neither can
# relax it. Flip this to enforce only after the QA ceremony below has run and
# one bin/deploy pre-flight prints OK for BOTH apps, or every production deploy
# will refuse. A filed `qa.system_wallet` alone is not that proof.
#
# ── the QA ceremony (done) ───────────────────────────────────────────────────
#
# turf-monster-qa holds its own SOLANA_ADMIN_KEY, the `qa.system_wallet` below,
# since release v276 (docs/qa-signing-key-rotation.md); its boot line reads
# "signer isolation (qa): OK — this key IS qa's system wallet". Production holds
# `production.system_wallet`. What remains is step 11 there: the enforce flip.
#
# ── resolving "this environment" ─────────────────────────────────────────────
#
# By the app's own facts, never by a name it is told: a DEPLOYED app (Rails
# production) on mainnet-beta is `production`, a deployed app on devnet is `qa`,
# and anything not deployed is `development`. bin/deploy names the environment
# per Heroku app through `heroku_app`.

mode: warn

environments:
  production:
    network: mainnet-beta
    deployed: true
    heroku_app: turf-monster-mainnet
    # solana.turf.server: production's SOLANA_ADMIN_KEY, the fee payer on the
    # server's mainnet transactions, and mainnet VaultState signer slot 2 (turf-vault
    # scripts/check-signer-slots.js reads 3LTL, 7ZDJ, 4S39, 9gAC, 3Qj4). It
    # replaced 8K81w4e6…, which the mainnet-signer-records-rotation rotation
    # retired. Derived from the chain, never from the secret.
    system_wallet: 4S39sKHHPV8GPjUif9noN9gdsAFGs9WASuGxs7B9s5CY

  qa:
    network: devnet
    deployed: true
    heroku_app: turf-monster-qa
    # 1Password `solana.turf.system.devnet` (vault studio-agents): the devnet
    # server key, turf-monster-qa's SOLANA_ADMIN_KEY since release v276, and
    # devnet VaultState slot 0 (turf-vault scripts/check-signer-slots.js
    # --cluster devnet reads 2eGs, 8UwJ, BVQH). Public key only.
    system_wallet: 2eGs8G3wzhEeNQQU2Q86BmmA2xTpDbMMae3Y1bvpZfx9

  development:
    network: devnet
    deployed: false
    # Local machines and the devnet e2e lane. No key of its own is filed yet:
    # the primary checkout's .env derives 8K81…, production's previous key and
    # now on no mainnet VaultState (measured 2026-09-27, public key only), and a development identity needs a
    # VaultState slot the deployed v0.25 program does not have (see the
    # runbook, "What this ceremony does not fix"). The boot guard does not run
    # in development.
    system_wallet: null
