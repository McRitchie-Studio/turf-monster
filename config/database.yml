# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: turf_monster_development

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: turf_monster

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: turf_monster_test
  # TEST_DATABASE_URL points the TEST env at a worktree's OWN isolated test DB.
  #
  # bin/agent-worktree already gives every desk its own test DB and writes it to
  # .env.test.local as TEST_DATABASE_URL — and the comment it generates in that
  # file states that THIS line reads it. This app never had the line, so the
  # variable was set, believed, and ignored: every worktree's `bin/rails test`
  # fell through to the shared `turf_monster_test` above. turf carries the most
  # open worktrees in the ecosystem, so one suite's fixtures land inside
  # another's run — counts drift and a seeded row turns up that nobody seeded,
  # and the failure is in neither diff.
  #
  # The second half is quieter and worse. A worktree exports DATABASE_URL at its
  # seeded DEVELOPMENT database, and DATABASE_URL is merged into whichever env is
  # CURRENT — so under RAILS_ENV=test it lands on this block. Measured on this
  # file before the line existed: the test env resolved to
  # `turf_monster_development`. An explicit `url:` outranks DATABASE_URL and
  # takes that back; without one the test env is a single stray export away from
  # `db:test:prepare` PURGING a development database.
  #
  # KEEP THE ERB BARE — no default, no ENV.fetch. When TEST_DATABASE_URL is unset
  # this renders empty, Rails treats an empty `url:` as absent, and the block
  # falls back to `database:` above with the DATABASE_URL merge intact. Measured
  # on this file, both fallback shapes still land on `turf_monster_test`: with no
  # DATABASE_URL it resolves as a HashConfig, and with CI's DATABASE_URL set it
  # resolves as a UrlConfig carrying that URL's credentials (user `postgres`,
  # port 5432). That second shape is exactly what CI runs on (ci.yml sets
  # DATABASE_URL and never sets TEST_DATABASE_URL), so hard-coding a default here
  # would outrank it and silently cut CI off from its own postgres service.
  # Both directions are asserted by test/lib/test_database_isolation_test.rb.
  url: <%= ENV["TEST_DATABASE_URL"] %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  <<: *default
  database: turf_monster_production
  username: turf_monster
  password: <%= ENV["TURF_MONSTER_DATABASE_PASSWORD"] %>
