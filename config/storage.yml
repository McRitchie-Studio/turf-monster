test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# THE FOUR REMOTE SERVICES. All four are Cloudflare R2 and nothing else: AWS S3
# is retired (lib/storage_backend.rb). They keep the names blob
# rows already record ("amazon" is a name now, not a vendor), so no row is
# rewritten.
#
# amazon / amazon_dev are private: `.url` is a signed, expiring URL.
# amazon_public / amazon_public_dev are public: `.url` is a PERMANENT absolute
# URL, "<R2_PUBLIC_URL>/<key>", for og:image (link-preview) assets ONLY.
# Unfurlers (Apple/iMessage, Twitter, Slack) cache the og:image URL, so a signed
# URL breaks the preview the moment the signature expires; attach og images to
# these (see OgImageAttachable, which picks the per-env NAME because
# has_one_attached's `service:` is a literal resolved at class load).
#
# BUCKETS. QA apps boot RAILS_ENV=production and load `amazon`/`amazon_public`;
# QA_ENV (read via Studio.qa_environment?, the same signal Studio::S3 keys on) is
# the one thing separating them. Unset or unrecognised resolves PRODUCTION. The
# _dev services always use turf-monster-dev.
#
# A DELETE IS A MOVE TO trash/. The private services are the engine's
# StudioTrashS3 (ActiveStorage::Service::StudioTrashS3Service) and the public
# ones R2Public (lib/active_storage/service/r2_public_service.rb), which inherits
# it: a purge or a replaced attachment copies the object to
# trash/<utc date>/<epoch ms>/<key> before deleting it, and the bucket's
# expire-trash-3d lifecycle rule removes the copy three days later. R2 has no
# object versioning, so that copy is the only undo. Both refuse to delete from a
# "*-production" bucket in a process that is not real production.
#
# WHEN THEY EXIST. Production (QA included) requires R2_ENDPOINT,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_PUBLIC_URL, and a missing one
# raises here, by name, at boot. Test, CI and a development boot with none of
# the four define no remote service at all: they run on Disk above.
<%
  StorageBackend.active_storage_stage # raises on a retired value (s3, mirror_to_*)
  remote = {}
  if (r2 = StorageBackend.r2_connection)
    main_bucket = Studio.qa_environment? ? "turf-monster-dev" : "turf-monster-production"
    services = { "amazon" => [main_bucket, false], "amazon_dev" => ["turf-monster-dev", false],
                 "amazon_public" => [main_bucket, true], "amazon_public_dev" => ["turf-monster-dev", true] }
    services.each do |name, (bucket, is_public)|
      # Checksums only when_required: Active Storage sends Content-MD5, aws-sdk-s3
      # >= 1.178 adds a CRC32 by default, and R2 refuses a request carrying both
      # ("You can only specify one non-default checksum at a time", 2026-09-28).
      config = { "service" => is_public ? "R2Public" : "StudioTrashS3", "endpoint" => r2.fetch("R2_ENDPOINT"),
                 "access_key_id" => r2.fetch("R2_ACCESS_KEY_ID"), "secret_access_key" => r2.fetch("R2_SECRET_ACCESS_KEY"),
                 "region" => "auto", "bucket" => bucket,
                 "request_checksum_calculation" => "when_required", "response_checksum_validation" => "when_required" }
      config["public_url"] = r2.fetch("R2_PUBLIC_URL") if is_public
      remote[name] = config
    end
  end
%>
<%= remote.to_yaml.delete_prefix("---\n") unless remote.empty? %>
