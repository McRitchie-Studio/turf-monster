<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Turf Monster</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.png" type="image/png">
  <!-- The last resort (task turf-adopts-not-found-page). The friendly not-found
       page is studio-engine's Studio::ExceptionsApp, inside Turf's layout. This
       file answers when that page cannot render, so it stands alone: no script,
       no stylesheet, no font to fetch, only the app icon (the navbar's mark,
       /icon-192.png). Same words and the same data-test hooks as the engine page.
       The colours are the Turf theme's (page, surface, border, cta, primary-ink)
       for a light page and a dark one. -->
  <style>
    :root {
      --page: #f8fafc;
      --surface: #ffffff;
      --border: #e4e6e8;
      --heading: #0f172a;
      --text: #666667;
      --eyebrow: #246227;
      --cta: #2e7d32;
      --cta-hover: #205823;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #1a1535;
        --surface: #3c3853;
        --border: rgba(95, 91, 114, 0.4);
        --heading: #ffffff;
        --text: #bab9c2;
        --eyebrow: #97be99;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--page);
      color: var(--text);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 28rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
    }
    img { display: block; width: 4rem; height: 4rem; margin: 0 auto 1.5rem; object-fit: contain; }
    .eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--eyebrow);
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 800; line-height: 1.2; color: var(--heading); }
    p.message { margin: 0 0 2rem; }
    a.home {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--cta);
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }
    a.home:hover { background: var(--cta-hover); }
    a.home:focus-visible { outline: 2px solid var(--cta); outline-offset: 3px; }
    @media (min-width: 640px) { a.home { width: auto; } }
  </style>
</head>
<body data-static-404>
  <main data-test="not-found" aria-labelledby="not-found-title">
    <img src="/icon-192.png" alt="Turf Monster" width="64" height="64">
    <p class="eyebrow">404 &middot; Not found</p>
    <h1 id="not-found-title">This page isn’t here</h1>
    <p class="message">The address may be mistyped, or the page may have moved. Head back home and pick up from there.</p>
    <a class="home" href="/" data-test="not-found-home">Back to Turf Monster</a>
  </main>
</body>
</html>
